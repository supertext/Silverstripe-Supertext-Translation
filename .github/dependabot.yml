version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # PHPUnit 13 needs PHP 8.4; the module supports PHP 8.3 (Silverstripe 6's minimum, CI tests 8.3).
      - dependency-name: "phpunit/phpunit"
        versions: [">=13"]
      # Guzzle 8 can't be installed: silverstripe/framework 6 requires guzzlehttp/guzzle ^7.9.
      - dependency-name: "guzzlehttp/guzzle"
        versions: [">=8"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directories: ["/tests/docs", "/tests/e2e"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
